    <script>
      // Gracefully suppress Vite HMR WebSocket connection failure in cloud preview sandbox
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('@vite/client') || e.message.includes('WebSocket') || e.message.includes('failed to connect'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('@vite/client'))) {
          e.preventDefault();
        }
      });
    </script>
